```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .calculator {
            width: 360px;
            padding: 20px;
            border-radius: 25px;
            background: #171717;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .display {
            width: 100%;
            height: 120px;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 18px;
            background: #0b0b0b;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            overflow: hidden;
        }

        .previous {
            color: #777;
            font-size: 18px;
            min-height: 25px;
        }

        .current {
            width: 100%;
            text-align: right;
            font-size: 38px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 18px;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            background: #252a34;
            color: #f5f5f5;
            transition: 0.15s;
            user-select: none;
        }

        button:hover {
            background: #343a46;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.94);
        }

        /* Orange operator buttons */
        .operator {
            background: #ff8c00;
            color: white;
        }

        .operator:hover {
            background: #ffa31a;
        }

        /* Clear and delete buttons */
        .function {
            background: #52616b;
            color: white;
        }

        .function:hover {
            background: #65747e;
        }

        /* Equal button */
        .equals {
            background: #00a896;
            color: white;
        }

        .equals:hover {
            background: #02bfa9;
        }

        .zero {
            grid-column: span 2;
        }

        @media (max-width: 400px) {
            .calculator {
                width: 94%;
            }

            button {
                height: 60px;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <div class="display">
        <div class="previous" id="previous"></div>
        <div class="current" id="current">0</div>
    </div>

    <div class="buttons">

        <button class="function" onclick="clearCalculator()">CLR</button>
        <button class="function" onclick="deleteLast()">⌫</button>
        <button class="function" onclick="percentage()">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button class="zero" onclick="appendNumber('0')">0</button>
        <button onclick="appendDecimal()">.</button>
        <button class="equals" onclick="calculate()">=</button>

    </div>
</div>

<script>

    let currentInput = "0";
    let previousInput = "";
    let operator = null;
    let shouldResetScreen = false;

    const currentDisplay = document.getElementById("current");
    const previousDisplay = document.getElementById("previous");


    function updateDisplay() {
        currentDisplay.textContent = currentInput;
        previousDisplay.textContent =
            previousInput + (operator ? " " + operator : "");
    }


    function appendNumber(number) {

        if (currentInput === "0" || shouldResetScreen) {
            currentInput = number;
            shouldResetScreen = false;
        } else {
            currentInput += number;
        }

        updateDisplay();
    }


    function appendDecimal() {

        if (shouldResetScreen) {
            currentInput = "0";
            shouldResetScreen = false;
        }

        if (!currentInput.includes(".")) {
            currentInput += ".";
        }

        updateDisplay();
    }


    function chooseOperator(selectedOperator) {

        if (operator !== null && !shouldResetScreen) {
            calculate();
        }

        previousInput = currentInput;
        operator = selectedOperator;
        shouldResetScreen = true;

        updateDisplay();
    }


    function calculate() {

        if (operator === null || shouldResetScreen) {
            return;
        }

        const previous = parseFloat(previousInput);
        const current = parseFloat(currentInput);

        if (isNaN(previous) || isNaN(current)) {
            return;
        }

        let result;

        switch (operator) {

            case "+":
                result = previous + current;
                break;

            case "-":
                result = previous - current;
                break;

            case "*":
                result = previous * current;
                break;

            case "/":

                if (current === 0) {
                    currentInput = "Cannot divide by 0";
                    previousInput = "";
                    operator = null;
                    updateDisplay();
                    return;
                }

                result = previous / current;
                break;
        }

        result = Math.round(
            (result + Number.EPSILON) * 100000000
        ) / 100000000;

        currentInput = result.toString();
        previousInput = "";
        operator = null;
        shouldResetScreen = true;

        updateDisplay();
    }


    function clearCalculator() {

        currentInput = "0";
        previousInput = "";
        operator = null;
        shouldResetScreen = false;

        updateDisplay();
    }


    function deleteLast() {

        if (
            currentInput.length === 1 ||
            currentInput === "Cannot divide by 0"
        ) {
            currentInput = "0";
        } else {
            currentInput = currentInput.slice(0, -1);
        }

        updateDisplay();
    }


    function percentage() {

        const number = parseFloat(currentInput);

        if (!isNaN(number)) {
            currentInput = (number / 100).toString();
        }

        updateDisplay();
    }


    document.addEventListener("keydown", function(event) {

        const key = event.key;

        if (!isNaN(key)) {
            appendNumber(key);
        }

        else if (key === ".") {
            appendDecimal();
        }

        else if (["+", "-", "*", "/"].includes(key)) {
            chooseOperator(key);
        }

        else if (key === "Enter" || key === "=") {
            event.preventDefault();
            calculate();
        }

        else if (key === "Backspace") {
            deleteLast();
        }

        else if (key === "Escape") {
            clearCalculator();
        }

        else if (key === "%") {
            percentage();
        }

    });

</script>

</body>
</html>
